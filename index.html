  <script>
    document.getElementById("closeHint").addEventListener("click", ()=> {

<div id="installBanner" class="install-banner">
  <div>
    <strong>📱 Install GramLess App</strong>
    <p>Get faster access to GramLess Locations</p>
  </div>
  <button id="installBtn">Install</button>
  <button id="closeInstall">✕</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    let installPrompt;

    const banner = document.getElementById("installBanner");
    const installBtn = document.getElementById("installBtn");
    const closeBtn = document.getElementById("closeInstall");

    // Android install detection
    window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        installPrompt = event;
    });

    // Install button
    installBtn.addEventListener("click", async () => {

        // Android
        if (installPrompt) {
            installPrompt.prompt();

            await installPrompt.userChoice;

            installPrompt = null;
        }

        // iPhone / iPad
        else if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
            alert(
                "To install GramLess:\n\n" +
                "1. Tap the Share button ⬆️\n" +
                "2. Tap 'Add to Home Screen'\n" +
                "3. Tap Add"
            );
        }

        // Other devices
        else {
            alert(
                "Open your browser menu and choose 'Add to Home Screen' to install GramLess."
            );
        }

    });

    // Close banner
    closeBtn.addEventListener("click", () => {
        banner.style.display = "none";
    });

});

if (window.matchMedia('(display-mode: standalone)').matches) {
  document.getElementById("installBanner").style.display = "none";
}

</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
