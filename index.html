<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GramLess Map</title>  <style>
    :root{
      --black:#0d0d0d;
      --yellow:#f5c400;
      --white:#ffffff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:var(--black);
      color:var(--white);
    }

    /* HEADER */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:#111;
      position:sticky;
      top:0;
      z-index:10;
      border-bottom:1px solid #222;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:bold;
      color:var(--yellow);
      font-size:18px;
    }

    .logo img{
      width:35px;
      height:35px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--yellow);
    }

    .nav button{
      background:transparent;
      border:1px solid var(--yellow);
      color:var(--yellow);
      padding:8px 12px;
      margin-left:10px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    .nav button:hover{
      background:var(--yellow);
      color:black;
    }

    /* MAP */
    .map-container{
      width:100%;
      height:80vh;
      padding:10px;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
      border-radius:12px;
    }

    /* ABOUT */
    .about{
      display:none;
      padding:20px;
      background:#111;
      border-top:1px solid #222;
    }

    .about h2{
      color:var(--yellow);
      margin-bottom:10px;
    }

    /* FLOAT BUTTON */
    .floating{
      position:fixed;
      bottom:20px;
      right:20px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .floating button{
      background:var(--yellow);
      border:none;
      padding:12px 14px;
      border-radius:50px;
      cursor:pointer;
      font-weight:bold;
      color:black;
      box-shadow:0 5px 15px rgba(0,0,0,0.4);
    }
  </style></head>
<body><header>
  <div class="logo">
    <img src="Logo.png" alt="GramLess Logo">
    GramLess
  </div>  <div class="nav">
    <a href="about.html">About Us</a>
  </div>
</header><!-- MAP --><div class="map-container">
  <iframe src="https://www.google.com/maps/d/u/0/embed?mid=1Fy3yHoyB-n1PPJpd2Zi-wStoeRjqZS4&ehbc=2E312F"></iframe>
</div><!-- ABOUT --><div class="about" id="about">
 
</div><!-- FLOAT BUTTONS --><div class="floating">
  <button onclick="findNearest()">📍 Nearest Store</button>
</div><script>
  function toggleAbout(){
    const about = document.getElementById('about');
    about.style.display = about.style.display === 'block' ? 'none' : 'block';
  }

  function findNearest(){
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        const url = `https://www.google.com/maps/search/store/@${lat},${lng},15z`;
        window.open(url, '_blank');
      });
    } else {
      alert("Location not supported");
    }
  }
</script></body>
</html>
