<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GramLess Map</title>  <style>
    :root{
      --black:#0d0d0d;
      --yellow:#f5c400;
      --white:#ffffff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:var(--black);
      color:var(--white);
    }

    /* HEADER */
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:#111;
      position:sticky;
      top:0;
      z-index:10;
      border-bottom:1px solid #222;
    }

    .title{
      font-size:18px;
      font-weight:bold;
      color:var(--yellow);
    }

    .nav a{
      text-decoration:none;
      border:1px solid var(--white);
      color:var(--white);
      padding:8px 12px;
      border-radius:8px;
      transition:0.3s;
    }


.contact{
  text-align:center;
  padding:40px 20px;
}

.contact h2{
  color:var(--yellow);
  margin-bottom:20px;
}

.links{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.links a{
  text-decoration:none;
  border:1px solid var(--white);
  color:var(--white);
  padding:10px 15px;
  border-radius:10px;
  transition:0.3s;
}

.links a:hover{
  background:var(--white);
  color:black;
}


    /* MAP */
    .map-container{
      width:100%;
      height:85vh;
      padding:10px;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
      border-radius:12px;
    }
  </style></head>
<body><header>
  <div class="title">GramLess</div>  <div class="nav">

    <a href="#contact">Contact</a>

  </div>
</header><div class="map-container">
  <iframe src="https://www.google.com/maps/d/u/0/embed?mid=1Fy3yHoyB-n1PPJpd2Zi-wStoeRjqZS4&ehbc=2E312F" width="640" height="480"</iframe>
</div></body>
</html>
