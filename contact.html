<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact GramLess</title>

  <style>
    :root{
      --black:#0b0b0b;
      --white:#ffffff;
      --muted:#b8b8b8;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:var(--black);
      color:var(--white);
      padding:40px 20px;
      text-align:center;
    }

    h1{
      font-size:32px;
      margin-bottom:8px;
      color:#f5c400;
    }

    p{
      color:var(--muted);
      margin-bottom:30px;
      font-size:14px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:15px;
      max-width:800px;
      margin:auto;
    }

    .card{
      padding:25px;
      border-radius:14px;
      text-decoration:none;
      color:white;
      transition:0.3s;
      font-weight:bold;
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:center;
    }

    /* INSTAGRAM */
    .instagram{
      background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
    }

    /* TIKTOK */
    .tiktok{
      background:linear-gradient(45deg,#25F4EE,#000000,#FE2C55);
    }

    /* FACEBOOK */
    .facebook{
      background:#1877F2;
    }

    .card:hover{
      transform:translateY(-6px);
      filter:brightness(1.1);
    }

    .name{
      font-size:18px;
    }

    .back{
      display:inline-block;
      margin-top:40px;
      text-decoration:none;
      border:1px solid var(--white);
      color:var(--white);
      padding:10px 18px;
      border-radius:10px;
      transition:0.3s;
    }

    .back:hover{
      background:var(--white);
      color:black;
    }

  </style>
</head>

<body>

  <h1>Contact Us</h1>
  <p>Follow GramLess on all platforms</p>

  <div class="grid">

    <a class="card instagram" href="https://www.instagram.com/gramless.arabia" target="_blank">
      <div class="name">Instagram</div>
    </a>

    <a class="card tiktok" href="https://www.tiktok.com/@gramless.superfoods" target="_blank">
      <div class="name">TikTok</div>
    </a>

    <a class="card facebook" href="https://www.facebook.com/share/1G8epLamcy/" target="_blank">
      <div class="name">Facebook</div>
    </a>

<a class="card website" href="https://gramless.com" target="_blank">
  <div class="name">Official Website</div>
  <div>Visit GramLess</div>
</a>

  </div>

  <a class="back" href="index.html">← Back Home</a>

</body>
</html>
