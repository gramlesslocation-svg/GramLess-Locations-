<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact GramLess</title>

  <style>
    :root{
      --black:#0b0b0b;
      --yellow:#f5c400;
      --white:#ffffff;
      --muted:#b8b8b8;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:var(--black);
      color:var(--white);
      padding:40px 20px;
      text-align:center;
    }

    h1{
      color:var(--yellow);
      font-size:32px;
      margin-bottom:8px;
    }

    p{
      color:var(--muted);
      margin-bottom:30px;
      font-size:14px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:15px;
      max-width:800px;
      margin:auto;
    }

    .card{
      background:#111;
      border:1px solid #222;
      padding:25px;
      border-radius:14px;
      text-decoration:none;
      color:white;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
      border-color:var(--yellow);
    }

    .title{
      color:var(--yellow);
      font-weight:bold;
      margin-bottom:6px;
    }

    .back{
      display:inline-block;
      margin-top:40px;
      text-decoration:none;
      border:1px solid var(--white);
      color:var(--white);
      padding:10px 18px;
      border-radius:10px;
      transition:0.3s;
    }

    .back:hover{
      background:var(--white);
      color:black;
    }
  </style>
</head>

<body>

  <h1>Contact Us</h1>
  <p>Connect with GramLess</p>

  <div class="grid">

    <a class="card" href="https://www.instagram.com/gramless.arabia" target="_blank">
      <div class="title">Instagram</div>
      <div>Daily updates</div>
    </a>

    <a class="card" href="https://www.tiktok.com/@gramless.superfoods" target="_blank">
      <div class="title">TikTok</div>
      <div>Videos & trends</div>
    </a>

    <a class="card" href="https://www.facebook.com/share/1G8epLamcy/" target="_blank">
      <div class="title">Facebook</div>
      <div>Community</div>
    </a>

  </div>

  <a class="back" href="index.html">← Back Home</a>

</body>
</html>
