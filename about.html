<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About GramLess</title>

  <style>
    :root{
      --black:#0d0d0d;
      --yellow:#f5c400;
      --white:#ffffff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:var(--black);
      color:var(--white);
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:#111;
      border-bottom:1px solid #222;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--yellow);
      font-weight:bold;
      font-size:18px;
    }

    .logo img{
      width:35px;
      height:35px;
      border-radius:50%;
      border:2px solid var(--yellow);
    }

    .nav a{
      text-decoration:none;
      border:1px solid var(--yellow);
      color:var(--yellow);
      padding:8px 12px;
      border-radius:8px;
      transition:0.3s;
    }

    .nav a:hover{
      background:var(--yellow);
      color:black;
    }

    .content{
      padding:20px;
    }

    h1{
      color:var(--yellow);
      margin-bottom:15px;
    }

    iframe{
      width:100%;
      height:70vh;
      border:none;
      border-radius:12px;
      margin-top:10px;
    }
  </style>
</head>

<body>

<header>
  

  <div class="nav">
    <a href="index.html">Back to Map</a>
  </div>
</header>

<div class="content">
  <h1>About GramLess</h1>

  <!-- PDF VIEWER -->
  <iframe src="about.pdf"></iframe>
</div>

</body>
</html>
