<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gramless Catalogue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    header {
      background: #000;
      color: #FFD700;
      text-align: center;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 2px solid #FFD700;
    }

    .container {
      width: 100%;
      height: 90vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .download {
      text-align: center;
      padding: 15px;
    }

    .btn {
      background: #FFD700;
      color: #000;
      padding: 12px 20px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }

    .btn:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

<header>
  GRAMLESS BASMATI 2025
</header>

<div class="download">
  <a href="catalog.pdf" class="btn" download>Download Catalogue</a>
</div>

<div class="container">
  <iframe src="catalog.pdf"></iframe>
</div>

</body>
</html>
